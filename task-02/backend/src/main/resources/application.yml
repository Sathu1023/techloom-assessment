server:
  port: ${PORT:8081}

spring:
  application:
    name: ecommerce-checkout-payment-system

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  reservation:
    expiry-minutes: 5
    sweep-interval-ms: 15000
  payment:
    simulate-latency-ms: 800

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5174}
