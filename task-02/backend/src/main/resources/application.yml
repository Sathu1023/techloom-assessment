server:
  address: 0.0.0.0
  port: ${PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: ecommerce-checkout-payment-system

  datasource:
    # DB_URL wins if set. Otherwise Railway's MYSQL* vars (from a connected MySQL service) are used.
    url: ${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3307}/${MYSQLDATABASE:ecommerce_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      # Keep retrying DB connections instead of killing the process on first miss.
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  reservation:
    expiry-minutes: 5
    sweep-interval-ms: 15000
  payment:
    simulate-latency-ms: 800

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5174}
