server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: pos-order-inventory-system

  datasource:
    # DB_URL wins if set. Otherwise Railway's MYSQL* vars (from a connected MySQL service) are used.
    url: ${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:pos_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      # Keep retrying DB connections instead of killing the process on first miss.
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Row-level pessimistic locking depends on the underlying DB transaction isolation.
        # READ_COMMITTED is fine because we take explicit pessimistic write locks where it matters.
        connection:
          isolation: 2 # TRANSACTION_READ_COMMITTED
    open-in-view: false

app:
  reservation:
    expiry-minutes: 5
    sweep-interval-ms: 15000   # how often the expiry sweeper runs
  payment:
    # Used only by the mock payment simulator (see MockPaymentGateway)
    simulate-latency-ms: 800

# Allow the React dev server / deployed frontend to call this API
cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}
